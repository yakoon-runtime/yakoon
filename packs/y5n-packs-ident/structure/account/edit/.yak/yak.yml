title: Account Edit
resolvable: true
navigable: false
contextual: false
host: /boot/python/runtime
entry:
  run: pack:y5n.packs.ident.apps.accounts.edit:main
invocation:
  params:
  - key: name
    positional: true
    required: true
  - key: password
  - key: enabled
  - key: mail
  - key: language
resources:
  ref: resource:y5n.packs.ident.resources.loader:content
  document:
    default:
      path: account/edit/default.ydf
  man:
    default:
      path: account/edit/man.ydf
